plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
    id("xyz.jpenilla.run-paper") version "2.3.1"
}

group = 'com.blbilink'
def baseVersion = "26.2.0"
// Read build number from CI environment variable
def buildNumber = System.getenv("GITHUB_RUN_NUMBER") ?: "SNAPSHOT"
version = "${baseVersion}.${buildNumber}"

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        name = "sonatype-oss-snapshots1"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    // GeyserMC/Floodgate repository
    maven {
        name = "opencollab-snapshot"
        url = "https://repo.opencollab.dev/main/"
    }
}

dependencies {
    compileOnly "dev.folia:folia-api:26.2.build.7-beta"
    implementation 'at.favre.lib:bcrypt:0.10.2'
    implementation fileTree(dir: 'libs', include: '*.jar')
    // Floodgate API (Bedrock support)
    compileOnly 'org.geysermc.floodgate:api:2.2.4-SNAPSHOT'
    // Cumulus (Floodgate Forms API)
    compileOnly 'org.geysermc.cumulus:cumulus:1.1.2'
}

tasks {
    runServer {
        
    }
    
    shadowJar {
        // Relocate BCrypt to avoid conflicts with other plugins
        relocate 'at.favre.lib.crypto.bcrypt', 'com.blbilink.neoLogin.lib.bcrypt'
        
        // Set classifier to empty so output is plugin-version.jar instead of plugin-version-all.jar
        archiveClassifier = ''
        
        // Exclude unnecessary files
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
    }
    
    // Ensure shadowJar runs during build
    build {
        dependsOn shadowJar
    }
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
